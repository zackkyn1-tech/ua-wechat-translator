name: Build & release APK

# Кожен push збирає APK і публікує його як новий реліз —
# додаток на телефоні бачить його і пропонує оновитися.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: echo "VERSION_CODE=$(( GITHUB_RUN_NUMBER + 3 ))" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MoyaMuzyka.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release create "v${VERSION_CODE}" MoyaMuzyka.apk \
            --title "1.${VERSION_CODE}" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA" \
            --latest
